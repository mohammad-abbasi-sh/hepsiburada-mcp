[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hepsiburada-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for hepsiburada.com shopping (search, product details, reviews, categories, price stats)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
hepsiburada-mcp = "hepsiburada_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hepsiburada_mcp"]
