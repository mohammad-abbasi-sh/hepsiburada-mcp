[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hepsiburada-mcp"
version = "0.2.0"
description = "Unofficial MCP server for hepsiburada.com shopping (search, product details, reviews, categories, price stats; optional local-session cart + favorites)"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
hepsiburada-mcp = "hepsiburada_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hepsiburada_mcp"]
